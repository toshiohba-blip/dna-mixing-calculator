<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>DNA計算</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;margin:0;background:#f3f6fa;color:#172033;padding-bottom:30px}
header{background:#2563eb;color:#fff;padding:18px 16px;text-align:center;font-size:22px;font-weight:700}
main{max-width:620px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000f}
h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}
.type-row{display:flex;gap:8px}.type-row label{flex:1;margin:0}.type-row input{position:absolute;opacity:0}.type-row span{display:block;border:1px solid #cbd5e1;border-radius:9px;padding:11px 6px;text-align:center;font-weight:600;background:#fff}
.type-row input:checked+span{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}.hint,.unit-note{font-size:12px;color:#64748b;margin-top:6px}.recommend{font-size:13px;color:#2563eb;margin-top:7px}
button{width:100%;border:0;border-radius:10px;padding:14px;font-size:18px;font-weight:700;background:#2563eb;color:#fff;margin-top:4px}.small-btn{background:#64748b;font-size:14px;padding:9px;margin-top:10px}
.result{background:#eff6ff;border-left:4px solid #2563eb;padding:12px;border-radius:8px;margin:9px 0}.result b{font-size:18px}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;margin-top:12px}
footer{text-align:center;color:#64748b;font-size:11px;padding:8px 15px}
</style></head><body><header>DNA計算</header><main>

<div class="card"><h2>① DNA A</h2>
<label>DNA A の種類</label><div class="type-row">
<label><input type="radio" name="typeA" value="ds" checked><span>2本鎖DNA (dsDNA)</span></label>
<label><input type="radio" name="typeA" value="ss"><span>1本鎖DNA (ssDNA)</span></label></div>
<label>DNA A サイズ（bp / nt）</label><input id="sizeA" type="number" min="0" step="any" inputmode="decimal" placeholder="例：1000">
<label>DNA A 濃度</label><div class="row"><input id="concA" type="number" min="0" step="any" inputmode="decimal" placeholder="例：10"><select id="unitA"><option value="ngul">ng/µL</option><option value="gl">g/L</option></select></div></div>

<div class="card"><h2>② DNA B</h2>
<label>DNA B の種類</label><div class="type-row">
<label><input type="radio" name="typeB" value="ds" checked><span>2本鎖DNA (dsDNA)</span></label>
<label><input type="radio" name="typeB" value="ss"><span>1本鎖DNA (ssDNA)</span></label></div>
<label>DNA B サイズ（bp / nt）</label><input id="sizeB" type="number" min="0" step="any" inputmode="decimal" placeholder="例：500">
<label>DNA B 濃度</label><div class="row"><input id="concB" type="number" min="0" step="any" inputmode="decimal" placeholder="例：10"><select id="unitB"><option value="ngul">ng/µL</option><option value="gl">g/L</option></select></div></div>

<div class="card"><h2>③ DNA A の目標量</h2>
<label>Aを何量 使用したいですか？</label><div class="row"><input id="targetA" type="number" min="0" step="any" inputmode="decimal" value="0.03">
<select id="targetUnit"><option value="pmol">pmol</option><option value="fmol">fmol</option></select></div>
<div class="recommend">推奨値：0.03 pmol（30 fmol）／自由に変更できます</div></div>

<div class="card"><h2>④ 混合モル比</h2><label>DNA A : DNA B = 1 : N</label>
<input id="ratioN" type="number" min="0" step="any" inputmode="decimal" value="1" placeholder="例：2"></div>

<div class="card"><button type="button" onclick="calculate()">計算する</button><div id="output"></div>
<button type="button" class="small-btn" onclick="clearSaved()">保存した入力値を消去</button></div>
</main><footer>入力値はこの端末のブラウザに保存され、外部には送信されません。<br>濃度換算：1 ng/µL = 0.001 g/L　｜　平均分子量：dsDNA = 660 g/mol/bp、ssDNA = 330 g/mol/nt</footer>

<script>
const ids=["sizeA","concA","unitA","sizeB","concB","unitB","targetA","targetUnit","ratioN"], radios=["typeA","typeB"];
function saveInputs(){let d={};ids.forEach(id=>d[id]=document.getElementById(id).value);radios.forEach(n=>{let e=document.querySelector('input[name="'+n+'"]:checked');d[n]=e?e.value:"ds"});localStorage.setItem("dnaCalculatorInputsV5",JSON.stringify(d))}
function loadInputs(){try{let d=JSON.parse(localStorage.getItem("dnaCalculatorInputsV5")||"{}");ids.forEach(id=>{if(d[id]!==undefined)document.getElementById(id).value=d[id]});radios.forEach(n=>{if(d[n]){let e=document.querySelector('input[name="'+n+'"][value="'+d[n]+'"]');if(e)e.checked=true}})}catch(e){}}
function clearSaved(){localStorage.removeItem("dnaCalculatorInputsV5");location.reload()}
function num(id){return Number(document.getElementById(id).value)}
function molarity(c,size,type){return c/(size*(type==="ds"?660:330))*1e6}
function fmt(x){if(!isFinite(x))return"—";if(x===0)return"0";if(Math.abs(x)>=1000||Math.abs(x)<.001)return x.toExponential(4);return Number(x.toPrecision(6)).toString()}
function calculate(){
 saveInputs();let a=["sizeA","concA","sizeB","concB","targetA","ratioN"].map(num);
 let [sizeA,concA,sizeB,concB,target,ratio]=a;
 let unitA=document.getElementById("unitA").value,unitB=document.getElementById("unitB").value,targetUnit=document.getElementById("targetUnit").value;
 let typeA=document.querySelector('input[name="typeA"]:checked').value,typeB=document.querySelector('input[name="typeB"]:checked').value,out=document.getElementById("output");
 if(a.some(v=>!isFinite(v)||v<=0)){out.innerHTML='<div class="error">サイズ、濃度、目標量、モル比には0より大きい数値を入力してください。</div>';return}
 let cAGL=(unitA==="ngul"?concA*0.001:concA),cBGL=(unitB==="ngul"?concB*0.001:concB);let molA=molarity(cAGL,sizeA,typeA),molB=molarity(cBGL,sizeB,typeB);
 let targetPmol=targetUnit==="fmol"?target/1000:target,targetFmol=targetPmol*1000;
 let volA=targetPmol/molA,bPmol=targetPmol*ratio,volB=bPmol/molB,total=volA+volB;
 out.innerHTML=`<div class="result"><div>Aのモル濃度</div><b>${fmt(molA)} pmol/µL</b><div class="hint">${fmt(molA*1000)} fmol/µL</div></div>
 <div class="result"><div>Aの目標量</div><b>${fmt(targetPmol)} pmol</b><div class="hint">${fmt(targetFmol)} fmol</div></div>
 <div class="result"><div>Aの添加量</div><b>${fmt(volA)} µL</b></div>
 <div class="result"><div>Bの必要量</div><b>${fmt(bPmol)} pmol</b><div class="hint">${fmt(bPmol*1000)} fmol</div></div>
 <div class="result"><div>Bのモル濃度</div><b>${fmt(molB)} pmol/µL</b><div class="hint">${fmt(molB*1000)} fmol/µL</div></div>
 <div class="result"><div>Bの添加量</div><b>${fmt(volB)} µL</b></div>
 <div class="result"><div>合計液量</div><b>${fmt(total)} µL</b></div>`}
document.addEventListener("DOMContentLoaded",()=>{loadInputs();ids.forEach(id=>{document.getElementById(id).addEventListener("input",saveInputs);document.getElementById(id).addEventListener("change",saveInputs)});radios.forEach(n=>document.querySelectorAll('input[name="'+n+'"]').forEach(e=>e.addEventListener("change",saveInputs)))});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
